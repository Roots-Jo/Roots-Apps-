<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="kpi_title">Roots Fulfilment KPIs</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css?v=2.1.0">
    <link rel="stylesheet" href="/css/navbar.css?v=10.0.7">
    <link rel="stylesheet" href="../css/orders.css?v=2.1.1">
    <link rel="stylesheet" href="/css/kpi_dashboard.css?v=1.1.0">
    <script type="module" src="/js/auth.js"></script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
    <script src="/js/arabic.js?v=4"></script>
</head>

<body>

    <div id="navbar"></div>
    <script src="/js/navbar.js?v=1.0.8"></script>

    <div class="container">
        <main class="page-card kpi-root">

            <!-- ── Header ── -->
            <div class="table-section-title" style="margin-top: 0;">
                <div class="section-title-left">
                    <span data-i18n="kpi_heading">Fulfilment KPIs</span>
                </div>
                <div class="section-title-right" style="display: flex; gap: 0.9rem; align-items: center;">
                    <span class="kpi-status">
                        <span class="kpi-dot load" id="kpi-status-dot"></span>
                        <span id="kpi-status-text">Connecting…</span>
                    </span>
                    <button type="button" id="kpi-refresh" class="btn-reset-filters"
                        data-i18n="kpi_refresh">Refresh</button>
                </div>
            </div>

            <p class="kpi-sub" id="kpi-date-range" style="margin-top: 0;">Loading…</p>

            <div class="kpi-load-bar" id="kpi-load-bar" hidden><i id="kpi-load-fill"></i></div>

            <!-- ── Filters ── -->
            <div class="summary-filters-bar" id="kpi-date-bar" style="display: none;">
                <div class="summary-filters-left">
                    <div class="filter-item">
                        <label for="kpi-df-from" class="filter-label" data-i18n="kpi_from">From</label>
                        <input type="date" id="kpi-df-from" class="sbox filter-select">
                    </div>
                    <div class="filter-item">
                        <label for="kpi-df-to" class="filter-label" data-i18n="kpi_to">To</label>
                        <input type="date" id="kpi-df-to" class="sbox filter-select">
                    </div>
                    <div class="filter-item" style="justify-content: flex-end;">
                        <span class="kpi-sub num" id="kpi-df-count" style="margin: 0 0 9px 0;"></span>
                    </div>
                </div>
                <div class="summary-filters-right">
                    <button type="button" id="kpi-df-reset" class="btn-reset-filters"
                        data-i18n="kpi_reset">Reset Filters</button>
                </div>
            </div>

            <!-- ── Rules ── -->
            <div class="kpi-rules">
                <span class="kpi-rule"><span data-i18n="kpi_rule_cutoff">Cutoff</span>: <b>10 PM</b></span>
                <span class="kpi-rule" data-i18n="kpi_rule_before">Before 10pm → <b>delivered next working
                        day</b></span>
                <span class="kpi-rule" data-i18n="kpi_rule_after">After 10pm → <b>delivered day after next</b></span>
                <span class="kpi-rule" data-i18n="kpi_rule_friday"><b>Friday excluded</b> from working hours</span>
                <span class="kpi-rule" data-i18n="kpi_rule_flag">Flagged = <b>delivered past SLA deadline</b></span>
            </div>

            <!-- ── States ── -->
            <div id="kpi-loading" class="empty-state">
                <h3 data-i18n="kpi_loading">Loading order data…</h3>
                <p id="kpi-loading-detail"></p>
            </div>

            <div id="kpi-error" class="empty-state kpi-hidden">
                <h3 data-i18n="kpi_err_title">Could not load data</h3>
                <p id="kpi-error-msg"></p>
            </div>

            <div id="kpi-app" class="kpi-hidden">
                <div class="kpi-tabs" id="kpi-tab-bar" role="tablist"></div>
                <div id="kpi-tab-content"></div>
            </div>

        </main>
    </div>

    <script type="module" src="/js/kpi_dashboard.js?v=1.1.0"></script>

</body>

</html>
