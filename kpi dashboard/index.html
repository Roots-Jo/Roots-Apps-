<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots — Fulfilment KPIs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d12;--surface:#12161e;--surface2:#1a1f2b;--surface3:#222838;--border:#262d3d;--text:#e4e9f2;--text2:#7a8599;--text3:#4e5769;--green:#34d399;--green-dim:#16332a;--red:#f87171;--red-dim:#331a1a;--amber:#fbbf24;--amber-dim:#332c16;--blue:#60a5fa;--blue-dim:#162540;--purple:#a78bfa;--cyan:#22d3ee;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:'Space Mono',monospace}
header{padding:28px 36px 0;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.brand h1 em{font-style:normal;color:var(--green)}
.brand p{color:var(--text2);font-size:13px;margin-top:3px}
.brand p a{color:var(--green);text-decoration:none}
.brand p a:hover{text-decoration:underline}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.refresh-btn:hover{border-color:var(--green);color:var(--text)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.err{background:var(--red)}
.status-dot.load{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* DATE FILTER */
.date-filter{padding:10px 36px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date-filter label{font-size:12px;color:var(--text2)}
.date-filter input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-family:inherit;font-size:12px}
.date-filter input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
.date-filter .reset-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.date-filter .reset-btn:hover{border-color:var(--red);color:var(--red)}
.date-filter .count{font-size:12px;color:var(--text3);margin-left:8px}
/* RULES */
.rules{padding:6px 36px 10px;display:flex;gap:8px;flex-wrap:wrap}
.rule-tag{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:16px;font-size:11px;letter-spacing:.3px}
.rule-tag b{color:var(--text);font-weight:600}
/* TABS */
.tabs{padding:8px 36px 0;display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--text)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
/* GRID */
.grid{padding:20px 36px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:border-color .15s}
.card:hover{border-color:#364058}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.card-t{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;font-weight:500;display:flex;align-items:center;gap:6px}
.card-t .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.big{font-family:'Space Mono',monospace;font-size:34px;font-weight:700;line-height:1}
.big .u{font-size:13px;color:var(--text2);font-weight:400;margin-left:3px}
.sub{font-size:12px;color:var(--text2);margin-top:7px}
.sub b{color:var(--text);font-weight:600}
.bars{margin-top:14px}
.brow{display:flex;align-items:center;margin-bottom:9px;gap:10px}
.blbl{width:120px;font-size:12px;color:var(--text);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{flex:1;height:26px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bfill{height:100%;border-radius:5px;display:flex;align-items:center;padding-left:9px;font-size:11px;font-family:'Space Mono',monospace;font-weight:700;color:#0a0d12;min-width:fit-content;transition:width .7s cubic-bezier(.22,1,.36,1)}
.flow{display:flex;align-items:stretch;gap:0;margin-top:14px}
.flow-box{flex:1;text-align:center;padding:16px 8px;border-radius:8px;background:var(--surface2);position:relative}
.flow-box.you{border:1px dashed var(--green)}
.flow-box.ext{border:1px dashed var(--text3);opacity:.7}
.flow-val{font-family:'Space Mono',monospace;font-size:22px;font-weight:700}
.flow-lbl{font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.flow-med{font-size:10px;color:var(--text3);margin-top:2px}
.flow-arrow{display:flex;align-items:center;padding:0 6px;color:var(--text3);font-size:16px}
.flow-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:9px;padding:2px 8px;border-radius:8px;white-space:nowrap;font-weight:600}
.flow-tag.ours{background:var(--green-dim);color:var(--green)}
.flow-tag.theirs{background:var(--surface3);color:var(--text2)}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 10px;color:var(--text2);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600}
.bg{background:var(--green-dim);color:var(--green)}.br{background:var(--red-dim);color:var(--red)}.ba{background:var(--amber-dim);color:var(--amber)}.bb{background:var(--blue-dim);color:var(--blue)}
.kpi-item{padding:14px 16px;background:var(--surface2);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--green)}
.kpi-item.w{border-left-color:var(--amber)}.kpi-item.d{border-left-color:var(--red)}.kpi-item.b{border-left-color:var(--blue)}
.kpi-n{font-weight:600;font-size:13px;margin-bottom:3px}
.kpi-d{font-size:11px;color:var(--text2);line-height:1.5}
.kpi-v{font-family:'Space Mono',monospace;font-size:11px;color:var(--green);margin-top:5px}
.breach-row{background:rgba(248,113,113,0.06)}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-val{font-family:'Space Mono',monospace;margin-left:auto;font-weight:600}
.filters{padding:0 36px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:18px;font-size:12px;cursor:pointer;font-family:inherit;transition:.12s}
.chip:hover{border-color:var(--green);color:var(--text)}
.chip.on{background:var(--green);color:#0a0d12;border-color:var(--green);font-weight:600}
.search-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:18px;font-size:12px;font-family:inherit;width:180px}
.search-input:focus{outline:none;border-color:var(--green)}
.search-input::placeholder{color:var(--text3)}
.msg-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;text-align:center;padding:40px}
.msg-screen .ico{font-size:56px;margin-bottom:20px;opacity:.25}
.msg-screen h2{font-size:22px;margin-bottom:10px}
.msg-screen p{color:var(--text2);max-width:520px;line-height:1.7;font-size:14px}
.msg-screen code{background:var(--surface2);padding:2px 8px;border-radius:4px;font-size:13px;color:var(--green)}
.msg-screen .steps{text-align:left;margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;max-width:560px;width:100%}
.msg-screen .steps li{margin-bottom:12px;color:var(--text2);font-size:13px;line-height:1.6}
.msg-screen .steps li b{color:var(--text)}
.hidden{display:none}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}.c3,.c4{grid-column:span 2}}
@media(max-width:768px){.grid{grid-template-columns:1fr;padding:0 16px 24px}.c2,.c3,.c4{grid-column:span 1}header,.rules,.tabs,.filters,.date-filter{padding-left:16px;padding-right:16px}.flow{flex-wrap:wrap;gap:8px}.flow-arrow{display:none}.flow-box{min-width:45%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><em>Roots</em> Fulfilment KPIs</h1>
    <p id="date-range">Loading... · <a href="https://docs.google.com/spreadsheets/d/1_iYeSfoZYVIEnApaUNTUA5sDoK3lQVqn0jONcb7YCrQ/edit?gid=0#gid=0" target="_blank">Open Google Sheet</a></p>
  </div>
  <div class="hdr-right">
    <span class="status-dot load" id="status-dot"></span>
    <span id="status-text" style="color:var(--text2);font-size:12px">Connecting...</span>
    <button class="refresh-btn" onclick="loadFromSheet()">Refresh</button>
  </div>
</header>
<div class="rules">
  <div class="rule-tag">🕙 Cutoff: <b>10 PM</b></div>
  <div class="rule-tag">📦 Before 10pm → <b>delivered next working day</b></div>
  <div class="rule-tag">🌙 After 10pm → <b>delivered day after next</b></div>
  <div class="rule-tag">🚫 <b>Friday excluded</b> from working hours</div>
  <div class="rule-tag">🔴 Flagged = <b>delivered past SLA deadline</b></div>
</div>
<div class="date-filter" id="date-filter-bar" style="display:none">
  <label>From</label><input type="date" id="df-from">
  <label>To</label><input type="date" id="df-to">
  <button class="reset-btn" onclick="resetDates()">Reset</button>
  <span class="count" id="df-count"></span>
</div>
<div id="loading-screen" class="msg-screen"><div class="ico" style="animation:pulse 1.5s infinite">📦</div><h2>Loading order data...</h2></div>
<div id="error-screen" class="msg-screen hidden"><div class="ico">⚠️</div><h2>Could not load data</h2><p id="error-msg"></p></div>
<div id="app" class="hidden">
  <div class="tabs" id="tab-bar"></div>
  <div id="tab-content"></div>
</div>
<script src="config.js"></script>
<script>
// === BUSINESS RULES ===
const FRIDAY=5,CUTOFF=22;
function isFri(d){return d.getDay()===FRIDAY}
function nextWD(d){const n=new Date(d);n.setDate(n.getDate()+1);while(isFri(n))n.setDate(n.getDate()+1);return n}
function slaDeadline(c){if(!c)return null;const dd=c.getHours()<CUTOFF?nextWD(c):nextWD(nextWD(c));return new Date(dd.getFullYear(),dd.getMonth(),dd.getDate(),23,59,59)}
function workHrs(s,e){if(!s||!e||e<=s)return null;let h=0;const c=new Date(s);while(c<e){if(!isFri(c)){const de=new Date(c);de.setHours(23,59,59);const se=e<de?e:de;if(se>c)h+=(se-c)/3600000}c.setDate(c.getDate()+1);c.setHours(0,0,0,0)}return h}

// === HELPERS ===
function parseDT(s){
  if(!s||!s.trim())return null;s=s.trim();
  let m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\s+(\d{1,2}):(\d{2})/);
  if(m){const a=+m[1],b=+m[2],yr=+m[3],hr=+m[4],mn=+m[5];let day,month;if(a>12){day=a;month=b}else if(b>12){day=b;month=a}else{day=a;month=b}return new Date(yr,month-1,day,hr,mn)}
  const d=new Date(s);return isNaN(d)?null:d;
}
function fH(h){if(h==null)return'—';if(h<1)return Math.round(h*60)+'m';if(h<24)return h.toFixed(1)+'h';return(h/24).toFixed(1)+'d'}
function fN(n){return n.toLocaleString()}
function pAmt(s){const m=(s||'').match(/([\d,.]+)/);return m?parseFloat(m[1].replace(',','')):0}
function fDtT(d){return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}
function fDtTD(d){return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',weekday:'short'}):'—'}
function dN(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function med(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]}

// === SHEET LOADER ===
const SHEET_ID='1_iYeSfoZYVIEnApaUNTUA5sDoK3lQVqn0jONcb7YCrQ';
function loadFromSheet(){
  show('loading-screen');setStatus('load','Loading...');
  const sid=(typeof ROOTS_CONFIG!=='undefined'&&ROOTS_CONFIG.SHEET_ID&&ROOTS_CONFIG.SHEET_ID!=='YOUR_GOOGLE_SHEET_ID_HERE')?ROOTS_CONFIG.SHEET_ID:SHEET_ID;
  const sn=(typeof ROOTS_CONFIG!=='undefined'&&ROOTS_CONFIG.SHEET_NAME)?ROOTS_CONFIG.SHEET_NAME:'Orders';
  fetch(`https://docs.google.com/spreadsheets/d/${sid}/export?format=csv&gid=0`)
    .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()})
    .then(csv=>{const p=Papa.parse(csv,{header:true,skipEmptyLines:true});if(!p.data||!p.data.length)throw new Error('No rows');processData(p.data);setStatus('live',`Live · ${p.data.length} rows`)})
    .catch(err=>{document.getElementById('error-msg').textContent=err.message;show('error-screen');setStatus('err','Error')});
}
function show(id){['loading-screen','error-screen','app'].forEach(s=>document.getElementById(s).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function setStatus(t,txt){document.getElementById('status-dot').className='status-dot '+t;document.getElementById('status-text').textContent=txt}

// === DATA ===
let ALL=[],AM='All',AT='overview',DF_FROM=null,DF_TO=null,BREACH_MERCHANT='All',ORDERS_MERCHANT='All',ORDERS_SEARCH='';

function processData(rows){
  const clean=rows.map(r=>{const o={};for(const k of Object.keys(r))o[k.trim().toUpperCase()]=(r[k]||'').trim();return o}).filter(r=>r['ORDER CREATED AT']);
  if(!clean.length){document.getElementById('error-msg').textContent='No valid rows.';show('error-screen');return}
  clean.forEach(o=>{
    o._cr=parseDT(o['ORDER CREATED AT']);o._pk=parseDT(o['ORDER PICKED AT']);o._pa=parseDT(o['ORDER PACKED AT']);
    o._sh=parseDT(o['ORDER SHIPPED AT']);o._dl=parseDT(o['ORDER DELIVERED AT']);o._cx=parseDT(o['ORDER CANCELLED AT']);
    o._sel=o['SELLER NAME']||'Unknown';o._st=(o['ORDER STATUS']||'').toUpperCase();o._amt=pAmt(o['ORDER AMOUNT']);
    o._dt=o['DELIVERY TYPE']||'';o._pm=o['PAYMENT MODE']||'';o._ref=o['ORDER REFERENCE']||o['ORDER ID']||'';
    o._cxr=o['ORDER CANCELLATION REASON']||'';o._city=o['DESTINATION CITY']||'';
    o._sla=slaDeadline(o._cr);o._breach=(o._dl&&o._sla)?o._dl>o._sla:null;
    o._wShip=workHrs(o._cr,o._sh);o._wPick=workHrs(o._cr,o._pk);o._wPack=workHrs(o._pk,o._pa);o._wPS=workHrs(o._pa,o._sh);
    o._cour=(o._sh&&o._dl)?(o._dl-o._sh)/3600000:null;o._e2e=(o._cr&&o._dl)?(o._dl-o._cr)/3600000:null;
    o._late=o._cr?o._cr.getHours()>=CUTOFF:false;
    o._canc=(o._st==='CANCELLED'||o._st==='RETURN TO ORIGIN');
    o._packer=o['PACKED BY']||'';
    o._creator=o['CREATED BY']||'';
    o._auto=['CUSTOM','SHOPIFY'].includes(o._creator.toUpperCase());
    const cpx=(o['COURIER PARTNER']||'').toLowerCase(),rem=(o['SHIPMENT REMARKS']||'').toLowerCase();
    o._courierName=cpx.includes('wassel')?'SkyNet':rem.includes('skynet')?'SkyNet':(rem.includes('click')||rem.includes('clicl'))?'Click':rem.trim()?'On-demand Drivers':o._dt.toUpperCase().includes('CLICK')?'Customer Pickup':'Other';
    o._codAmt=(o._pm==='CASH ON DELIVERY')?pAmt(o['COLLECTION AMOUNT']||o['ORDER AMOUNT']):0;
  });
  ALL=clean;
  // Set date filter defaults
  const ds=clean.map(o=>o._cr).filter(Boolean).sort((a,b)=>a-b);
  if(ds.length){
    const fmt=d=>d.toISOString().slice(0,10);
    document.getElementById('df-from').value=fmt(ds[0]);
    document.getElementById('df-to').value=fmt(ds[ds.length-1]);
    document.getElementById('df-from').min=fmt(ds[0]);document.getElementById('df-to').max=fmt(ds[ds.length-1]);
  }
  document.getElementById('date-filter-bar').style.display='flex';
  show('app');rTabs();rTab();
}

// === DATE FILTER ===
function getFiltered(){
  let f=AM==='All'?[...ALL]:ALL.filter(o=>o._sel===AM);
  const from=document.getElementById('df-from').value;
  const to=document.getElementById('df-to').value;
  if(from){const d=new Date(from);d.setHours(0,0,0,0);f=f.filter(o=>o._cr&&o._cr>=d)}
  if(to){const d=new Date(to);d.setHours(23,59,59,999);f=f.filter(o=>o._cr&&o._cr<=d)}
  return f;
}
function resetDates(){
  const ds=ALL.map(o=>o._cr).filter(Boolean).sort((a,b)=>a-b);
  if(ds.length){const fmt=d=>d.toISOString().slice(0,10);document.getElementById('df-from').value=fmt(ds[0]);document.getElementById('df-to').value=fmt(ds[ds.length-1])}
  rTab();
}
document.getElementById('df-from').addEventListener('change',()=>rTab());
document.getElementById('df-to').addEventListener('change',()=>rTab());

// === TABS ===
const TABS=[{id:'overview',label:'Overview'},{id:'sla',label:'SLA Compliance'},{id:'merchants',label:'Merchants'},{id:'biz',label:'Business'},{id:'breaches',label:'Breached Orders'},{id:'orders',label:'All Orders'},{id:'kpis',label:'Suggested KPIs'}];
function rTabs(){document.getElementById('tab-bar').innerHTML=TABS.map(t=>`<button class="tab ${t.id===AT?'active':''}" onclick="sT('${t.id}')">${t.label}</button>`).join('')}
function sT(id){AT=id;rTabs();rTab()}

function rTab(){
  const el=document.getElementById('tab-content');
  const f=getFiltered();
  const d=f.filter(o=>o._st==='DELIVERED');
  const c=f.filter(o=>o._canc);
  const ms=[...new Set(ALL.map(o=>o._sel))].sort();
  document.getElementById('df-count').textContent=`${f.length} orders in range`;
  // Update header date range
  const ds=f.map(o=>o._cr).filter(Boolean).sort((a,b)=>a-b);
  const fmtD=d2=>d2.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('date-range').innerHTML=(ds.length?`${fmtD(ds[0])} — ${fmtD(ds[ds.length-1])} · ${f.length} orders`:'No orders in range')+` · <a href="https://docs.google.com/spreadsheets/d/1_iYeSfoZYVIEnApaUNTUA5sDoK3lQVqn0jONcb7YCrQ/edit?gid=0#gid=0" target="_blank">Open Sheet</a>`;
  switch(AT){
    case'overview':el.innerHTML=rOverview(f,d,c,ms);break;
    case'sla':el.innerHTML=rSLA(f,d,c);break;
    case'merchants':el.innerHTML=rMerch(f,ms);break;
    case'biz':el.innerHTML=rBiz(f,d,c,ms);break;
    case'breaches':el.innerHTML=rBreach(d,ms);break;
    case'orders':el.innerHTML=rOrders(f,ms);break;
    case'kpis':el.innerHTML=rKPIs(f,d,c,ms);break;
  }
}

// === OVERVIEW ===
function rOverview(f,del,canc,ms){
  const tot=f.length,dr=tot?del.length/tot*100:0,cr=tot?canc.length/tot*100:0;
  const rev=del.reduce((s,o)=>s+o._amt,0),aov=del.length?rev/del.length:0;
  const st=del.map(o=>o._wShip).filter(h=>h!=null&&h>0),as=avg(st),ms2=med(st);
  const ws=del.filter(o=>o._breach!==null),br=ws.filter(o=>o._breach);
  const sla=ws.length?((ws.length-br.length)/ws.length*100):0;
  const ct=del.map(o=>o._cour).filter(h=>h!=null&&h>0),ac=avg(ct);
  const pt=del.map(o=>o._wPick).filter(h=>h!=null&&h>0);
  const pkt=del.map(o=>o._wPack).filter(h=>h!=null&&h>0);
  const pst=del.map(o=>o._wPS).filter(h=>h!=null&&h>0);
  const cc=f.filter(o=>o._dt.includes('CLICK')).length,nd=f.filter(o=>o._dt.includes('NORMAL')).length;
  const e2e=del.map(o=>o._e2e).filter(h=>h!=null&&h>0),ae2e=avg(e2e),me2e=med(e2e);
  return`
  <div class="filters" style="padding-top:16px">
    ${['All',...ms].map(m=>`<button class="chip ${m===AM?'on':''}" onclick="AM='${m}';rTab()">${m} (${m==='All'?ALL.length:ALL.filter(o=>o._sel===m).length})</button>`).join('')}
  </div>

    <div class="card"><div class="card-t"><div class="dot" style="background:${sla>=90?'var(--green)':sla>=75?'var(--amber)':'var(--red)'}"></div>SLA Compliance</div><div class="big mono" style="color:${sla>=90?'var(--green)':sla>=75?'var(--amber)':'var(--red)'}">${sla.toFixed(1)}<span class="u">%</span></div><div class="sub">${br.length} of ${ws.length} breached</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--purple)"></div>Order to Delivery <small style="color:var(--text3)">(merchant KPI)</small></div><div class="big mono" style="color:var(--purple)">${fH(ae2e)}</div><div class="sub">Median: <b>${fH(me2e)}</b> · What merchants see</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--blue)"></div>Avg Fulfilment <small style="color:var(--text3)">(working hrs)</small></div><div class="big mono" style="color:var(--blue)">${fH(as)}</div><div class="sub">Median: <b>${fH(ms2)}</b> · Order → Shipped</div></div>
    <div class="card c4"><div class="card-t">Fulfilment Pipeline — Working Hours (excl. Friday)</div>
      <div class="flow">

        <div class="flow-arrow">→</div>
        <div class="flow-box you"><div class="flow-val" style="color:var(--cyan)">${fH(avg(pkt))}</div><div class="flow-lbl">Pick → Pack</div><div class="flow-med">median ${fH(med(pkt))}</div></div>
        <div class="flow-arrow">→</div>
        <div class="flow-box you"><div class="flow-val" style="color:var(--green)">${fH(avg(pst))}</div><div class="flow-lbl">Pack → Ship</div><div class="flow-med">median ${fH(med(pst))}</div></div>
        <div class="flow-arrow" style="font-size:20px">⇥</div>
        <div class="flow-box ext"><div class="flow-tag theirs">COURIER</div><div class="flow-val" style="color:var(--text3)">${fH(ac)}</div><div class="flow-lbl">Ship → Deliver</div><div class="flow-med">not in our control</div></div>
        <div class="flow-arrow">=</div>
        <div class="flow-box" style="border:1px solid var(--purple);background:linear-gradient(135deg,var(--surface2),rgba(167,139,250,0.08))"><div class="flow-tag" style="background:rgba(167,139,250,0.15);color:var(--purple)">MERCHANT KPI</div><div class="flow-val" style="color:var(--purple)">${fH(ae2e)}</div><div class="flow-lbl">Order → Deliver</div><div class="flow-med">median ${fH(me2e)}</div></div>
      </div>
    </div>
    <div class="card"><div class="card-t">Revenue</div><div class="big mono" style="font-size:26px">${rev.toFixed(0)}<span class="u">JOD</span></div><div class="sub">AOV: <b>${aov.toFixed(1)} JOD</b></div></div>
    <div class="card"><div class="card-t">Cancel Rate <small style="color:var(--text3)">(incl. RTO)</small></div><div class="big mono" style="color:${cr>5?'var(--red)':cr>3?'var(--amber)':'var(--green)'}">${cr.toFixed(1)}<span class="u">%</span></div><div class="sub">${canc.filter(o=>o._st==='CANCELLED').length} cancelled · ${canc.filter(o=>o._st==='RETURN TO ORIGIN').length} RTO</div></div>
    <div class="card"><div class="card-t">Delivery Split</div><div style="margin-top:6px"><div class="legend-item"><div class="legend-dot" style="background:var(--cyan)"></div>Click & Collect<span class="legend-val mono">${cc}</span></div><div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Normal Delivery<span class="legend-val mono">${nd}</span></div></div></div>
    <div class="card"><div class="card-t">Payment Modes</div><div style="margin-top:6px">${renderPM(f)}</div></div>
  </div>`;
}
function renderPM(f){const m={};f.forEach(o=>{const k=o._pm||'Other';m[k]=(m[k]||0)+1});const cols={'PREPAID':'var(--green)','CASH ON DELIVERY':'var(--amber)','OTHER':'var(--purple)','POSTPAID':'var(--blue)'};return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`<div class="legend-item"><div class="legend-dot" style="background:${cols[k]||'var(--text2)'}"></div>${k.toLowerCase().replace(/\b\w/g,l=>l.toUpperCase())}<span class="legend-val mono">${v}</span></div>`).join('')}

// === SLA ===
function rSLA(f,del,canc){
  const ws=del.filter(o=>o._breach!==null),br=ws.filter(o=>o._breach),on=ws.length-br.length;
  const sla=ws.length?(on/ws.length*100):0;
  const bc=del.filter(o=>!o._late),ac=del.filter(o=>o._late);
  const bcB=bc.filter(o=>o._breach).length,acB=ac.filter(o=>o._breach).length;
  const bcR=bc.length?((bc.length-bcB)/bc.length*100):0,acR=ac.length?((ac.length-acB)/ac.length*100):0;
  const ms=[...new Set(del.map(o=>o._sel))];
  const mSLA=ms.map(m=>{const mo=del.filter(o=>o._sel===m&&o._breach!==null);const mb=mo.filter(o=>o._breach);return{name:m,total:mo.length,breached:mb.length,rate:mo.length?((mo.length-mb.length)/mo.length*100):0}}).sort((a,b)=>a.rate-b.rate);
  const days=[0,1,2,3,4,6].map(d=>{const dO=del.filter(o=>o._cr&&o._cr.getDay()===d&&o._breach!==null);const dB=dO.filter(o=>o._breach);return{day:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d],total:dO.length,breached:dB.length,rate:dO.length?((dO.length-dB.length)/dO.length*100):0}});
  return`
  <div class="grid" style="padding-top:20px">
    <div class="card"><div class="card-t"><div class="dot" style="background:${sla>=90?'var(--green)':'var(--red)'}"></div>Overall SLA</div><div class="big mono" style="color:${sla>=90?'var(--green)':sla>=75?'var(--amber)':'var(--red)'}">${sla.toFixed(1)}<span class="u">%</span></div><div class="sub">${on} on-time · ${br.length} breached</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--blue)"></div>Before 10 PM</div><div class="big mono" style="color:${bcR>=90?'var(--green)':'var(--amber)'}">${bcR.toFixed(1)}<span class="u">%</span></div><div class="sub">${bc.length} orders · ${bcB} breached</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--purple)"></div>After 10 PM</div><div class="big mono" style="color:${acR>=90?'var(--green)':'var(--amber)'}">${acR.toFixed(1)}<span class="u">%</span></div><div class="sub">${ac.length} orders · ${acB} breached</div></div>
    <div class="card"><div class="card-t">SLA Rules</div><div style="font-size:12px;line-height:1.8;margin-top:4px"><div>🕙 Cutoff: <b>10 PM</b></div><div>📦 Before → <b>delivered next working day</b></div><div>🌙 After → <b>delivered day after next</b></div><div>🚫 <b>Friday excluded</b></div></div></div>
    <div class="card c2"><div class="card-t">SLA by Merchant</div><div class="bars">${mSLA.map(m=>{const col=m.rate>=90?'var(--green)':m.rate>=75?'var(--amber)':'var(--red)';return`<div class="brow"><div class="blbl">${m.name}</div><div class="btrack"><div class="bfill" style="width:${Math.max(m.rate,8)}%;background:${col}">${m.rate.toFixed(0)}% (${m.breached})</div></div></div>`}).join('')}</div></div>
    <div class="card c2"><div class="card-t">SLA by Day Created</div><div class="bars">${days.map(d=>{const col=d.rate>=90?'var(--green)':d.rate>=75?'var(--amber)':'var(--red)';return`<div class="brow"><div class="blbl">${d.day} (${d.total})</div><div class="btrack"><div class="bfill" style="width:${Math.max(d.rate,8)}%;background:${col}">${d.rate.toFixed(0)}%</div></div></div>`}).join('')}</div></div>
  </div>`;
}

// === MERCHANTS ===
function rMerch(filtered,ms){
  const data=ms.map(m=>{
    const o=filtered.filter(x=>x._sel===m);const d=o.filter(x=>x._st==='DELIVERED');const c=o.filter(x=>x._canc);
    const so=d.filter(x=>x._breach!==null);const sb=so.filter(x=>x._breach);
    const st=d.map(x=>x._wShip).filter(h=>h!=null&&h>0);const pt=d.map(x=>x._wPick).filter(h=>h!=null&&h>0);
    const ct=d.map(x=>x._cour).filter(h=>h!=null&&h>0);const e2et=d.map(x=>x._e2e).filter(h=>h!=null&&h>0);
    return{name:m,total:o.length,delivered:d.length,cancelled:c.length,
      dr:o.length?(d.length/o.length*100):0,sla:so.length?((so.length-sb.length)/so.length*100):0,slB:sb.length,
      aShip:avg(st),aPick:avg(pt),aCour:avg(ct),aE2E:avg(e2et),mE2E:med(e2et),
      rev:d.reduce((s,x)=>s+x._amt,0),aov:d.length?d.reduce((s,x)=>s+x._amt,0)/d.length:0}
  });
  return`

    <div class="card c4"><div class="card-t">Merchant Comparison — Working Hours (excl. Friday)</div><div class="tbl-wrap"><table>
      <thead><tr><th>Merchant</th><th>Orders</th><th>Del %</th><th>SLA</th><th>Breaches</th><th>Avg Pick</th><th>Avg Ship</th><th style="color:var(--text3)">Courier</th><th style="color:var(--purple)">Order→Deliver</th><th>Revenue</th><th>AOV</th></tr></thead>
      <tbody>${data.map(m=>`<tr><td><b>${m.name}</b></td><td class="mono">${m.total}</td><td><span class="badge ${m.dr>=95?'bg':m.dr>=90?'ba':'br'}">${m.dr.toFixed(0)}%</span></td><td><span class="badge ${m.sla>=90?'bg':m.sla>=75?'ba':'br'}">${m.sla.toFixed(0)}%</span></td><td class="mono" style="color:${m.slB>0?'var(--red)':'var(--green)'}">${m.slB}</td><td class="mono">${fH(m.aPick)}</td><td class="mono">${fH(m.aShip)}</td><td class="mono" style="color:var(--text3)">${fH(m.aCour)}</td><td class="mono" style="color:var(--purple);font-weight:700">${fH(m.aE2E)}</td><td class="mono">${m.rev.toFixed(0)}</td><td class="mono">${m.aov.toFixed(0)}</td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="card c2"><div class="card-t">SLA by Merchant</div><div class="bars">${[...data].sort((a,b)=>a.sla-b.sla).map(m=>{const col=m.sla>=90?'var(--green)':m.sla>=75?'var(--amber)':'var(--red)';return`<div class="brow"><div class="blbl">${m.name}</div><div class="btrack"><div class="bfill" style="width:${Math.max(m.sla,8)}%;background:${col}">${m.sla.toFixed(0)}%</div></div></div>`}).join('')}</div></div>
    <div class="card c2"><div class="card-t" style="color:var(--purple)">Order → Delivered by Merchant</div><div class="bars">${[...data].sort((a,b)=>b.aE2E-a.aE2E).map(m=>{const mx=Math.max(...data.map(x=>x.aE2E))||1;const col=m.aE2E<48?'var(--green)':m.aE2E<96?'var(--amber)':'var(--red)';return`<div class="brow"><div class="blbl">${m.name}</div><div class="btrack"><div class="bfill" style="width:${Math.min(m.aE2E/mx*100,100)}%;background:${col}">${fH(m.aE2E)} <span style="font-weight:400;color:var(--text2);margin-left:4px">med ${fH(m.mE2E)}</span></div></div></div>`}).join('')}</div></div>
  </div>`;
}

// === KPIs ===
function rKPIs(f,del,canc,ms){
  const ws=del.filter(o=>o._breach!==null);const sla=ws.length?((ws.length-ws.filter(o=>o._breach).length)/ws.length*100):0;
  const cr=f.length?(canc.length/f.length*100):0;

  const pst=del.map(o=>o._wPS).filter(h=>h!=null&&h>0);const st=del.map(o=>o._wShip).filter(h=>h!=null&&h>0);
  const e2e=del.map(o=>o._e2e).filter(h=>h!=null&&h>0);
  const stages={'Order → Pick':avg(pt),'Pick → Pack':avg(pkt),'Pack → Ship':avg(pst)};
  const bn=Object.entries(stages).sort((a,b)=>b[1]-a[1])[0];
  const sdp=del.filter(o=>{if(!o._cr||!o._pk)return false;if(isFri(o._cr))return false;return o._cr.toDateString()===o._pk.toDateString()}).length;
  const sdpR=del.length?(sdp/del.length*100):0;
  return`
  <div class="grid" style="padding-top:20px">
    <div class="card c2">
      <div class="card-t"><div class="dot" style="background:var(--green)"></div>Core KPIs — Track Weekly</div>
      <div style="margin-top:8px">
        <div class="kpi-item" style="border-left-color:var(--purple)"><div class="kpi-n">🎯 Order to Delivery (Full Cycle)</div><div class="kpi-d">Calendar hours from order placed to customer received. <b>This is what your merchants care about most.</b></div><div class="kpi-v">Current: avg ${fH(avg(e2e))}, median ${fH(med(e2e))} · Target: under 48h</div></div>
        <div class="kpi-item"><div class="kpi-n">📦 SLA Compliance Rate</div><div class="kpi-d">% of orders delivered before SLA deadline. Before 10pm = delivered next working day. After 10pm = delivered day after next.</div><div class="kpi-v">Current: ${sla.toFixed(1)}% · Target: 90%+</div></div>
        <div class="kpi-item b"><div class="kpi-n">⏱️ Same-Day Pick Rate</div><div class="kpi-d">Orders picked same day created (excl. Friday).</div><div class="kpi-v">Current: ${sdpR.toFixed(1)}% · Target: 85%+</div></div>
        <div class="kpi-item w"><div class="kpi-n">🔄 Pick-to-Pack Cycle</div><div class="kpi-d">Working hours from pick to pack.</div><div class="kpi-v">Current: ${fH(avg(pkt))} · Target: under 30m</div></div>
        <div class="kpi-item"><div class="kpi-n">🚀 Fulfilment Speed</div><div class="kpi-d">Working hours, order created → shipped.</div><div class="kpi-v">Current: ${fH(avg(st))} avg</div></div>
        <div class="kpi-item w"><div class="kpi-n">🚫 Cancellation Rate</div><div class="kpi-d">Seller vs customer.</div><div class="kpi-v">Current: ${cr.toFixed(1)}% · Target: below 3%</div></div>
        <div class="kpi-item b"><div class="kpi-n">📊 Orders/Operator/Hour</div><div class="kpi-d">Needs operator tracking. Benchmark: 15-25/op/hr.</div><div class="kpi-v">Needs data</div></div>
        <div class="kpi-item d"><div class="kpi-n">🔙 Return Rate</div><div class="kpi-d">Critical for COD markets.</div><div class="kpi-v">Target: below 5%</div></div>
      </div>
    </div>
    <div class="card c2">
      <div class="card-t"><div class="dot" style="background:var(--amber)"></div>Insights & Actions</div>
      <div style="margin-top:8px">
        <div class="kpi-item d"><div class="kpi-n">🔍 Bottleneck: ${bn?bn[0]:'—'}</div><div class="kpi-d">Slowest stage: <b>${bn?fH(bn[1]):'—'}</b>. ${bn&&bn[0]==='Order → Pick'?'Auto-assign to pickers or start picks earlier.':bn&&bn[0]==='Pack → Ship'?'Add a second daily courier pickup.':'Focus here.'}</div></div>
        <div class="kpi-item w"><div class="kpi-n">💵 COD: ${f.length?(f.filter(o=>o._pm==='CASH ON DELIVERY').length/f.length*100).toFixed(0):'0'}%</div><div class="kpi-d">Track COD delivery failures separately.</div></div>
        <div class="kpi-item w"><div class="kpi-n">🔢 ${canc.filter(o=>o._cxr.includes('Seller')).length} Seller Cancels</div><div class="kpi-d">Push merchants to real-time stock sync.</div></div>
      </div>
    </div>
  </div>`;
}

// === EXPORT BREACHES ===
function exportBreaches(){
  const del=getFiltered().filter(o=>o._st==='DELIVERED');
  let br=del.filter(o=>o._breach);
  if(BREACH_MERCHANT!=='All')br=br.filter(o=>o._sel===BREACH_MERCHANT);
  br.sort((a,b)=>(b._e2e||0)-(a._e2e||0));
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const head=['Ref','Merchant','Created At','Created Day','After 10pm','SLA Deadline','Deadline Day','Shipped At','Shipped Day','Delivered At','Delivered Day','E2E Hours','Overshoot Hours'];
  const lines=[head.map(esc).join(',')];
  br.forEach(o=>{
    const ov=o._dl&&o._sla?((o._dl-o._sla)/3600000).toFixed(1):'';
    lines.push([o._ref,o._sel,fDtT(o._cr),o._cr?dN(o._cr):'',o._late?'Yes':'No',fDtT(o._sla),o._sla?dN(o._sla):'',fDtT(o._sh),o._sh?dN(o._sh):'',fDtT(o._dl),o._dl?dN(o._dl):'',o._e2e!=null?o._e2e.toFixed(1):'',ov].map(esc).join(','));
  });
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`breached-orders-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();URL.revokeObjectURL(a.href);
}

// === BUSINESS TAB ===
function rBiz(f,del,canc,ms){
  const tot=f.length;
  // Active merchants (>=1 order in range)
  const activeMerchants=[...new Set(f.map(o=>o._sel))];
  // Delivered per merchant
  const delPerM=activeMerchants.map(m=>({name:m,n:del.filter(o=>o._sel===m).length,total:f.filter(o=>o._sel===m).length})).sort((a,b)=>b.n-a.n);
  // Courier split (only orders that shipped)
  const shipped=f.filter(o=>o._sh);
  const courierCount={};shipped.forEach(o=>{courierCount[o._courierName]=(courierCount[o._courierName]||0)+1});
  const courierList=Object.entries(courierCount).sort((a,b)=>b[1]-a[1]);
  const courierCols={'SkyNet':'var(--blue)','Click':'var(--cyan)','On-demand Drivers':'var(--amber)','Customer Pickup':'var(--green)','Other':'var(--text3)'};
  // COD
  const codOrders=f.filter(o=>o._pm==='CASH ON DELIVERY');
  const codPct=tot?codOrders.length/tot*100:0;
  const codDelivered=del.filter(o=>o._pm==='CASH ON DELIVERY');
  const codTotal=codDelivered.reduce((s,o)=>s+o._codAmt,0);
  // Created by: automated vs manual
  const auto=f.filter(o=>o._auto).length;
  const autoPct=tot?auto/tot*100:0;
  // Packer metrics (delivered + shipped orders with pack data)
  const packed=f.filter(o=>o._packer&&o._pa);
  const packers={};
  packed.forEach(o=>{
    if(!packers[o._packer])packers[o._packer]={n:0,speeds:[]};
    packers[o._packer].n++;
    const sp=workHrs(o._pk,o._pa);
    if(sp!=null&&sp>0)packers[o._packer].speeds.push(sp);
  });
  const packerList=Object.entries(packers).map(([name,d])=>({name,n:d.n,pct:packed.length?d.n/packed.length*100:0,avgSp:avg(d.speeds),medSp:med(d.speeds)})).sort((a,b)=>b.n-a.n);
  return`
  <div class="grid" style="padding-top:20px">
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--green)"></div>Active Merchants</div><div class="big mono" style="color:var(--green)">${activeMerchants.length}</div><div class="sub">≥1 order in selected period</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--text2)"></div>Delivered Orders</div><div class="big mono">${fN(del.length)}</div><div class="sub">of ${fN(tot)} total in range</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--amber)"></div>COD Share</div><div class="big mono" style="color:var(--amber)">${codPct.toFixed(1)}<span class="u">%</span></div><div class="sub">${codOrders.length} COD orders · <b>${codTotal.toFixed(0)} JOD</b> collected (delivered)</div></div>
    <div class="card"><div class="card-t"><div class="dot" style="background:var(--cyan)"></div>Automated Orders</div><div class="big mono" style="color:var(--cyan)">${autoPct.toFixed(1)}<span class="u">%</span></div><div class="sub">${auto} via integration (Custom/Shopify) · ${tot-auto} manual</div></div>

    <div class="card c2"><div class="card-t">Delivered Orders per Merchant</div><div class="bars">
      ${delPerM.map(m=>{const mx=Math.max(...delPerM.map(x=>x.n))||1;return`<div class="brow"><div class="blbl">${m.name}</div><div class="btrack"><div class="bfill" style="width:${Math.max(m.n/mx*100,6)}%;background:var(--green)">${m.n} <span style="font-weight:400;color:rgba(0,0,0,.5);margin-left:4px">of ${m.total}</span></div></div></div>`}).join('')}
    </div></div>

    <div class="card c2"><div class="card-t">Courier Split (shipped orders)</div><div class="bars">
      ${courierList.map(([name,n])=>{const mx=courierList[0][1]||1;const pct=shipped.length?n/shipped.length*100:0;return`<div class="brow"><div class="blbl">${name}</div><div class="btrack"><div class="bfill" style="width:${Math.max(n/mx*100,6)}%;background:${courierCols[name]||'var(--text3)'}">${n} (${pct.toFixed(0)}%)</div></div></div>`}).join('')}
    </div>
    <div class="sub" style="margin-top:10px">SkyNet = Wassel Express account · Click = identified via shipment remarks · Customer Pickup = Click & Collect orders</div></div>

    <div class="card c4"><div class="card-t">Operator Performance — Packing</div><div class="tbl-wrap"><table>
      <thead><tr><th>Packer</th><th>Orders Packed</th><th>% of All Packed</th><th>Avg Pack Speed (pick→pack, working hrs)</th><th>Median Speed</th></tr></thead>
      <tbody>${packerList.map(p=>`<tr>
        <td><b>${p.name}</b></td>
        <td class="mono">${p.n}</td>
        <td class="mono">${p.pct.toFixed(1)}%</td>
        <td class="mono" style="color:${p.avgSp<0.5?'var(--green)':p.avgSp<2?'var(--amber)':'var(--red)'}">${fH(p.avgSp)}</td>
        <td class="mono">${fH(p.medSp)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="sub" style="margin-top:10px">Pack speed = working hours from picked to packed (excl. Friday). Lower is better.</div></div>
  </div>`;
}

// === BOOT ===
window.addEventListener('DOMContentLoaded',()=>loadFromSheet());
</script>
